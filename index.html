<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="K-Trace — Kabankalan Transparency & Citizen Engagement. Track government projects, review itemized budgets, and report mismatches.">
  <title>K-Trace — Citizen Dashboard</title>
  <link rel="icon" type="image/png" href="https://kabankalancity.gov.ph/wp-content/uploads/2023/09/Kabankalan_City_seal.svg_.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="app-container">
    <nav class="top-bar" id="top-bar">
      <a href="index.html" class="brand">
        <img src="https://kabankalancity.gov.ph/wp-content/uploads/2023/09/Kabankalan_City_seal.svg_.png" alt="Kabankalan City Seal" class="brand-icon">
        <div class="brand-text">
          <span class="brand-name">K-Trace</span>
          <span class="brand-tagline">Kabankalan Transparency</span>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-pill active">Dashboard</a>
        <a href="#projects-section" class="nav-pill">Projects</a>
      </div>
    </nav>

    <header class="page-header">
      <h1>Citizen Dashboard</h1>
      <p>Track every peso. Every project. Every receipt. Transparency starts&nbsp;here.</p>
    </header>

    <section class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-icon budget"><i data-lucide="banknote"></i></div>
        <span class="stat-label">Total Budget</span>
        <span class="stat-value" id="stat-total-budget">—</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon pending"><i data-lucide="hourglass"></i></div>
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending">—</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon ongoing"><i data-lucide="hammer"></i></div>
        <span class="stat-label">Ongoing</span>
        <span class="stat-value" id="stat-ongoing">—</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon completed"><i data-lucide="check-circle-2"></i></div>
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="stat-completed">—</span>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#FEE2E2; color:#991B1B"><i data-lucide="alert-triangle"></i></div>
        <span class="stat-label">Delayed</span>
        <span class="stat-value" id="stat-delayed">—</span>
      </div>
    </section>

    <section class="filter-bar" id="category-filter-bar" style="margin-bottom: 10px;">
      <button class="filter-pill active" data-category="All">🏢 All Scopes</button>
      <button class="filter-pill" data-category="City">🏙️ City Level</button>
      <button class="filter-pill" data-category="Barangay">🏘️ Barangay Level</button>
    </section>

    <section class="filter-bar" id="status-filter-bar">
      <button class="filter-pill active" data-status="All">All Statuses</button>
      <button class="filter-pill" data-status="Pending">⏳ Pending</button>
      <button class="filter-pill" data-status="Ongoing">🔨 Ongoing</button>
      <button class="filter-pill" data-status="Completed">✅ Completed</button>
      <button class="filter-pill" data-status="Delayed">🚨 Delayed</button>
    </section>

    <section id="projects-section">
      <div class="projects-grid" id="projects-grid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </section>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    const SUPABASE_URL = 'https://aknvhyezfkfjglpfkjdi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gqv6WXEo8cVvIVwrLLXuzQ_lqmfSCC6';

    async function supabaseFetch(table, query) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    let allProjects = [];
    let activeStatus = 'All';
    let activeCategory = 'All';
    const projectsGrid = document.getElementById('projects-grid');
    const statusFilterBar = document.getElementById('status-filter-bar');
    const categoryFilterBar = document.getElementById('category-filter-bar');

    function formatPeso(amount) {
      return '₱' + Number(amount).toLocaleString('en-PH', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function statusBadge(status) {
      return '<span class="status-badge ' + status.toLowerCase() + '">' + status + '</span>';
    }

    function renderProjects(projects) {
      if (projects.length === 0) {
        projectsGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📋</div><h3 class="empty-state-title">No projects found</h3><p class="empty-state-text">No projects match your filter.</p></div>';
        return;
      }
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        var p = projects[i];
        var isBrgy = (p.department.toLowerCase().includes('brgy') || p.department.toLowerCase().includes('barangay'));
        var catBadge = isBrgy ? '<span class="status-badge" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border)">🏘️ Barangay</span>' : '<span class="status-badge" style="background:var(--card-bg);color:var(--text);border:1px solid var(--border)">🏙️ City</span>';
        
        html += '<a href="project-details.html?id=' + p.id + '" class="project-card">';
        html += '<div class="project-card-header"><div>';
        html += '<h3 class="project-card-title">' + p.title + '</h3>';
        html += '<p class="project-card-dept">' + p.department + '</p>';
        html += '</div><div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;">' + catBadge + statusBadge(p.status) + '</div></div>';
        html += '<p class="project-card-description">' + (p.description || 'No description.') + '</p>';
        html += '<div class="project-card-footer"><div>';
        html += '<div class="project-budget">' + formatPeso(p.total_budget) + '</div>';
        html += '<div class="project-budget-label">Total Budget</div>';
        html += '</div><div class="project-location"><span>📍</span> ' + (p.location || 'TBD') + '</div>';
        html += '</div></a>';
      }
      projectsGrid.innerHTML = html;
    }

    function updateStats(projects) {
      var total = 0, pending = 0, ongoing = 0, completed = 0, delayed = 0;
      for (var i = 0; i < projects.length; i++) {
        total += Number(projects[i].total_budget);
        if (projects[i].status === 'Pending') pending++;
        if (projects[i].status === 'Ongoing') ongoing++;
        if (projects[i].status === 'Completed') completed++;
        if (projects[i].status === 'Delayed') delayed++;
      }
      document.getElementById('stat-total-budget').textContent = formatPeso(total);
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-ongoing').textContent = ongoing;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-delayed').textContent = delayed;
    }

    function applyFilters() {
      var filtered = [];
      for (var i = 0; i < allProjects.length; i++) {
        var p = allProjects[i];
        var isBrgy = (p.department.toLowerCase().includes('brgy') || p.department.toLowerCase().includes('barangay'));
        var pCat = isBrgy ? 'Barangay' : 'City';
        
        var matchStatus = (activeStatus === 'All' || p.status === activeStatus);
        var matchCategory = (activeCategory === 'All' || pCat === activeCategory);
        
        if (matchStatus && matchCategory) {
          filtered.push(p);
        }
      }
      renderProjects(filtered);
    }

    function applyStatusFilter(status) {
      activeStatus = status;
      var pills = statusFilterBar.querySelectorAll('.filter-pill');
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.toggle('active', pills[i].getAttribute('data-status') === status);
      }
      applyFilters();
    }

    function applyCategoryFilter(category) {
      activeCategory = category;
      var pills = categoryFilterBar.querySelectorAll('.filter-pill');
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.toggle('active', pills[i].getAttribute('data-category') === category);
      }
      applyFilters();
    }

    // Event listeners for filters
    statusFilterBar.addEventListener('click', function(e) {
      if (e.target.classList.contains('filter-pill')) {
        applyStatusFilter(e.target.getAttribute('data-status'));
      }
    });

    categoryFilterBar.addEventListener('click', function(e) {
      if (e.target.classList.contains('filter-pill')) {
        applyCategoryFilter(e.target.getAttribute('data-category'));
      }
    });

    async function fetchProjects() {
      try {
        var projects = await supabaseFetch('projects', 'select=*&order=created_at.desc');
        allProjects = projects || [];
        updateStats(allProjects);
        renderProjects(allProjects);
      } catch (err) {
        projectsGrid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">⚠️</div><h3 class="empty-state-title">Connection Error</h3><p class="empty-state-text">' + err.message + '</p><button class="btn btn-primary btn-sm" onclick="fetchProjects()" style="margin-top:16px">Retry</button></div>';
      }
    }

    fetchProjects();
    
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>

</html>
