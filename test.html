<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>K-Trace - Connection Test</title>
  <style>
    body { font-family: 'Inter', sans-serif; padding: 40px; background: #F4F5F7; }
    .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    h1 { margin-bottom: 24px; }
    .status { padding: 8px 16px; border-radius: 8px; margin: 8px 0; font-family: monospace; font-size: 13px; }
    .ok { background: #D1FAE5; color: #065F46; }
    .err { background: #FEE2E2; color: #991B1B; }
    .info { background: #DBEAFE; color: #1E40AF; }
    pre { background: #1F2937; color: #F9FAFB; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🔍 K-Trace Connection Diagnostic</h1>

  <div class="card">
    <h3>Test 1: Direct REST API Fetch</h3>
    <div id="test1">Running...</div>
  </div>

  <div class="card">
    <h3>Test 2: Supabase JS Client</h3>
    <div id="test2">Running...</div>
  </div>

  <div class="card">
    <h3>Test 3: Project Data</h3>
    <pre id="test3">Waiting for test results...</pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://aknvhyezfkfjglpfkjdi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gqv6WXEo8cVvIVwrLLXuzQ_lqmfSCC6';

    // TEST 1: Direct REST API
    (async () => {
      const el = document.getElementById('test1');
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/projects?select=id,title,status&limit=3`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );
        const text = await res.text();
        el.innerHTML = `<div class="status ${res.ok ? 'ok' : 'err'}">HTTP ${res.status} — ${res.ok ? 'SUCCESS' : 'FAILED'}</div>`;
        document.getElementById('test3').textContent = text;

        if (res.ok) {
          const data = JSON.parse(text);
          el.innerHTML += `<div class="status ok">✅ Found ${data.length} projects</div>`;
        } else {
          el.innerHTML += `<div class="status err">❌ Response: ${text}</div>`;
        }
      } catch (err) {
        el.innerHTML = `<div class="status err">❌ Fetch error: ${err.message}</div>`;
      }
    })();

    // TEST 2: Supabase JS Client
    (async () => {
      const el = document.getElementById('test2');
      try {
        if (!window.supabase) {
          el.innerHTML = `<div class="status err">❌ window.supabase is undefined — CDN script not loaded</div>`;
          return;
        }
        el.innerHTML = `<div class="status info">window.supabase exists ✓</div>`;

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        el.innerHTML += `<div class="status ok">createClient() succeeded ✓</div>`;

        const { data, error } = await client.from('projects').select('id,title').limit(3);

        if (error) {
          el.innerHTML += `<div class="status err">❌ Query error: ${JSON.stringify(error)}</div>`;
        } else {
          el.innerHTML += `<div class="status ok">✅ Query returned ${data.length} projects via JS client</div>`;
        }
      } catch (err) {
        el.innerHTML += `<div class="status err">❌ Exception: ${err.message}</div>`;
      }
    })();
  </script>
</body>
</html>
